<svg viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <title>LUC Volleyball Analytics — Data Pipeline</title>

  <rect width="780" height="620" fill="#0f0f0f" rx="12"/>

  <!-- Title -->
  <text x="390" y="34" text-anchor="middle" fill="#FEBC18" font-size="14" font-weight="700" letter-spacing="0.5">LUC VOLLEYBALL ANALYTICS — DATA PIPELINE</text>
  <text x="390" y="50" text-anchor="middle" fill="#555" font-size="9.5">Loyola University Chicago Men's Volleyball · Python · JavaScript · GitHub Pages</text>

  <!-- ─── ROW 1: SOURCE FILES ─── y=65–125 -->
  <rect x="55"  y="65" width="140" height="60" rx="6" fill="#1a1a1a" stroke="#8D0034" stroke-width="1.5"/>
  <text x="125" y="83"  text-anchor="middle" fill="#8D0034" font-size="8"   font-weight="700" letter-spacing="0.7">MATCH FILES</text>
  <text x="125" y="99"  text-anchor="middle" fill="#ddd"    font-size="11"  font-weight="600">.dvw / .vm</text>
  <text x="125" y="114" text-anchor="middle" fill="#555"    font-size="8">DataVolley · Volleymetrics</text>

  <rect x="210" y="65" width="140" height="60" rx="6" fill="#1a1a1a" stroke="#8D0034" stroke-width="1.5"/>
  <text x="280" y="83"  text-anchor="middle" fill="#8D0034" font-size="8"   font-weight="700" letter-spacing="0.7">PRACTICE FILES</text>
  <text x="280" y="99"  text-anchor="middle" fill="#ddd"    font-size="11"  font-weight="600">.dvw</text>
  <text x="280" y="114" text-anchor="middle" fill="#555"    font-size="8">DataVolley format</text>

  <rect x="365" y="65" width="140" height="60" rx="6" fill="#1a1a1a" stroke="#8D0034" stroke-width="1.5"/>
  <text x="435" y="83"  text-anchor="middle" fill="#8D0034" font-size="8"   font-weight="700" letter-spacing="0.7">SCOUT FILES</text>
  <text x="435" y="99"  text-anchor="middle" fill="#ddd"    font-size="11"  font-weight="600">.dvw</text>
  <text x="435" y="114" text-anchor="middle" fill="#555"    font-size="8">Opponent scouting data</text>

  <!-- converge lines → parse -->
  <line x1="125" y1="125" x2="125" y2="155" stroke="#444" stroke-width="1.4"/>
  <line x1="280" y1="125" x2="280" y2="155" stroke="#444" stroke-width="1.4"/>
  <line x1="435" y1="125" x2="435" y2="155" stroke="#444" stroke-width="1.4"/>
  <line x1="125" y1="155" x2="280" y2="155" stroke="#444" stroke-width="1.4"/>
  <line x1="435" y1="155" x2="280" y2="155" stroke="#444" stroke-width="1.4"/>
  <line x1="280" y1="155" x2="280" y2="168" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ─── ROW 2: PARSE ─── y=168–235 -->
  <rect x="190" y="168" width="180" height="67" rx="7" fill="#1a1a1a" stroke="#FEBC18" stroke-width="2"/>
  <text x="280" y="188" text-anchor="middle" fill="#FEBC18" font-size="8.5" font-weight="700" letter-spacing="0.7">PYTHON PARSER</text>
  <text x="280" y="205" text-anchor="middle" fill="#eee"    font-size="12"  font-weight="600">parse_dvw.py</text>
  <text x="280" y="220" text-anchor="middle" fill="#777"    font-size="8">Rally · Action · Zone · Rotation detection</text>
  <text x="280" y="232" text-anchor="middle" fill="#777"    font-size="8">Coding version inference · Date parsing</text>

  <!-- parse → json -->
  <line x1="280" y1="235" x2="280" y2="260" stroke="#FEBC18" stroke-width="2" marker-end="url(#aG)"/>

  <!-- ─── ROW 3: INTERMEDIATE STORAGE ─── y=260–315 -->
  <rect x="185" y="260" width="190" height="55" rx="7" fill="#191900" stroke="#FEBC18" stroke-width="1.3"/>
  <text x="280" y="279" text-anchor="middle" fill="#FEBC18" font-size="8"   font-weight="700" letter-spacing="0.7">INTERMEDIATE JSON</text>
  <text x="280" y="296" text-anchor="middle" fill="#eee"    font-size="11"  font-weight="600">volleyball_data.json</text>
  <text x="280" y="310" text-anchor="middle" fill="#666"    font-size="8">All sessions · players · rally actions · zones</text>

  <!-- json → aggregate -->
  <line x1="280" y1="315" x2="280" y2="340" stroke="#FEBC18" stroke-width="2" marker-end="url(#aG)"/>

  <!-- ─── ROW 4: AGGREGATE ─── y=340–410 -->
  <rect x="180" y="340" width="200" height="70" rx="7" fill="#1a1a1a" stroke="#FEBC18" stroke-width="2"/>
  <text x="280" y="360" text-anchor="middle" fill="#FEBC18" font-size="8.5" font-weight="700" letter-spacing="0.7">PYTHON AGGREGATOR</text>
  <text x="280" y="377" text-anchor="middle" fill="#eee"    font-size="12"  font-weight="600">aggregate.py</text>
  <text x="280" y="392" text-anchor="middle" fill="#777"    font-size="8">Stats · Rotations · Setter calls · Zones</text>
  <text x="280" y="404" text-anchor="middle" fill="#777"    font-size="8">Float/Topspin splits · SO% · PSP%</text>

  <!-- aggregate → dashboard_data.json -->
  <line x1="280" y1="410" x2="280" y2="435" stroke="#FEBC18" stroke-width="2" marker-end="url(#aG)"/>

  <!-- ─── ROW 5: DASHBOARD STORAGE ─── y=435–490 -->
  <rect x="185" y="435" width="190" height="55" rx="7" fill="#191900" stroke="#FEBC18" stroke-width="1.3"/>
  <text x="280" y="454" text-anchor="middle" fill="#FEBC18" font-size="8"   font-weight="700" letter-spacing="0.7">DASHBOARD JSON</text>
  <text x="280" y="470" text-anchor="middle" fill="#eee"    font-size="11"  font-weight="600">dashboard_data.json</text>
  <text x="280" y="484" text-anchor="middle" fill="#666"    font-size="8">Injected into HTML template at build time</text>

  <!-- ─── HTML TEMPLATE feeds in from left ─── -->
  <rect x="40" y="445" width="128" height="52" rx="6" fill="#1a1a1a" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="104" y="462" text-anchor="middle" fill="#7aaaff" font-size="8"   font-weight="700" letter-spacing="0.6">HTML TEMPLATE</text>
  <text x="104" y="476" text-anchor="middle" fill="#ccc"    font-size="9.5" font-weight="600">dashboard_template</text>
  <text x="104" y="488" text-anchor="middle" fill="#555"    font-size="7.5">.html  ·  JS · CSS · Charts</text>

  <!-- template arrow → final output -->
  <line x1="168" y1="471" x2="204" y2="471" stroke="#4a7fb5" stroke-width="1.4" marker-end="url(#aB)"/>

  <!-- data json + template → dashboard.html -->
  <line x1="280" y1="490" x2="280" y2="515" stroke="#FEBC18" stroke-width="2" marker-end="url(#aG)"/>

  <!-- ─── ROW 6: FINAL OUTPUT ─── y=515–560 -->
  <rect x="195" y="515" width="170" height="45" rx="7" fill="#1a1a1a" stroke="#8D0034" stroke-width="2"/>
  <text x="280" y="533" text-anchor="middle" fill="#8D0034" font-size="8"   font-weight="700" letter-spacing="0.6">FINAL OUTPUT</text>
  <text x="280" y="550" text-anchor="middle" fill="#eee"    font-size="12"  font-weight="600">dashboard.html</text>

  <!-- dashboard.html → GitHub Pages -->
  <line x1="365" y1="537" x2="410" y2="537" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- GitHub Pages -->
  <rect x="410" y="515" width="160" height="45" rx="7" fill="#1a1a1a" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="490" y="533" text-anchor="middle" fill="#7aaaff" font-size="8"   font-weight="700" letter-spacing="0.6">GITHUB PAGES</text>
  <text x="490" y="550" text-anchor="middle" fill="#ccc"    font-size="10.5" font-weight="600">tshaffer212.github.io</text>

  <!-- ─── DASHBOARD VIEWS callout (right side, spans rows 2–6) ─── -->
  <rect x="590" y="168" width="158" height="260" rx="6" fill="#111" stroke="#222" stroke-width="1"/>
  <text x="669" y="186" text-anchor="middle" fill="#FEBC18" font-size="8.5" font-weight="700" letter-spacing="0.5">DASHBOARD VIEWS</text>
  <line x1="598" y1="191" x2="740" y2="191" stroke="#222" stroke-width="1"/>
  <text x="600" y="207" fill="#777" font-size="8.5">→ Attack &amp; Efficiency</text>
  <text x="600" y="222" fill="#777" font-size="8.5">→ Serve &amp; Receive</text>
  <text x="600" y="237" fill="#777" font-size="8.5">→ Float / Topspin split</text>
  <text x="600" y="252" fill="#777" font-size="8.5">→ Rotation Overview</text>
  <text x="600" y="267" fill="#777" font-size="8.5">→ Sideout % &amp; PSP%</text>
  <text x="600" y="282" fill="#777" font-size="8.5">→ Setter Breakdown</text>
  <text x="600" y="297" fill="#777" font-size="8.5">→ Zone Shot Charts</text>
  <text x="600" y="312" fill="#777" font-size="8.5">→ Player Profiles</text>
  <text x="600" y="327" fill="#777" font-size="8.5">→ Season Filtering</text>
  <text x="600" y="342" fill="#777" font-size="8.5">→ Match / Practice mode</text>
  <text x="600" y="357" fill="#777" font-size="8.5">→ Block differential</text>
  <text x="600" y="372" fill="#777" font-size="8.5">→ Multi-season trends</text>
  <!-- dashed connector -->
  <line x1="590" y1="290" x2="570" y2="290" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- footer -->
  <text x="390" y="607" text-anchor="middle" fill="#2e2e2e" font-size="8.5">Python · JavaScript · HTML/CSS · GitHub Pages · Git</text>

  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#555"/></marker>
    <marker id="aG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#FEBC18"/></marker>
    <marker id="aB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#4a7fb5"/></marker>
  </defs>
</svg>
