<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Loyola Volleyball, Player Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* -- Editorial "sports page" theme - light only ------------------------------- */
:root{
  --paper:#fbfaf7; --white:#fff; --ink:#1c1b19; --ink2:#2d2b27; --muted:#6b6760; --dim:#9a958c;
  --rule:#d9d5cc; --rule2:#ebe7df; --tint:#f3f1ec;
  --accent:#7a0026; --gold:#8a6500; --green:#2e6b3a; --red:#a3281f;
  --serif:"Source Serif 4","Iowan Old Style","Charter","Georgia",serif;
  --sans:"IBM Plex Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 40px}
.m{color:var(--muted);font-size:12px}.g{color:inherit}.r{color:inherit}.gold{color:inherit} .acc{color:var(--accent)} .hi{color:var(--green)} .lo{color:var(--red)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.kicker{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}

/* -- Login -- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px}
.lbox{width:100%;max-width:380px;background:var(--white);border:1px solid var(--rule);border-top:3px solid var(--accent);padding:30px 28px 24px}
.lbox .logo{font-family:var(--serif);font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:1.05;margin-top:6px;color:var(--ink)}
.lbox .sub{font-size:13px;color:var(--muted);margin-top:6px;padding-bottom:16px;border-bottom:1px solid var(--rule2)}
.lbox label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 6px}
.lbox select,.lbox input{width:100%;background:var(--white);border:1px solid var(--rule);border-radius:2px;padding:10px 11px;color:var(--ink);font-size:15px;appearance:auto}
.lbox select:focus,.lbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,0,38,.12)}
.lbox button{width:100%;margin-top:22px;background:var(--accent);border:0;border-radius:2px;padding:12px;color:#fff;font-weight:600;font-size:15px;letter-spacing:.2px;cursor:pointer}
.lbox button:hover{background:#63001f}
.lbox button:disabled{opacity:.6;cursor:wait}
#lerr{color:var(--red);font-size:13px;margin-top:12px;min-height:18px;text-align:center}
.lbox .help-line{margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}

/* -- Masthead -- */
#app{display:none}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.mast h1{font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:-.8px;line-height:1.05;margin-top:6px}
.mast h1 .num{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--dim);letter-spacing:0;margin-right:10px;vertical-align:.55em}
.mast-r{text-align:right;font-size:13px;color:var(--muted);line-height:1.6;flex:none}
.txtbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.txtbtn:hover{color:#63001f}

/* -- Nav (report tabs) -- */
.viewsw{display:flex;margin:16px 0 4px;border:1px solid var(--ink);border-radius:4px;overflow:hidden;width:max-content}
.viewsw button{background:none;border:0;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.viewsw button.on{background:var(--accent);color:#fff}
#scout-wrap{display:none;padding:0 10px 16px}
#scout-wrap iframe{width:100%;height:calc(100vh - 30px);min-height:720px;border:0;display:block}
#scout-status{max-width:1180px;margin:0 auto;padding:0 32px;color:var(--muted);font-size:14px}
#scout-status:not(:empty){padding:12px 32px}
.tabs{display:flex;align-items:flex-end;gap:24px;border-bottom:1px solid var(--rule);margin:0 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 0 10px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tabs .acts{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);padding:12px 0 10px;white-space:nowrap}
.tabs .acts button{border:0;padding:0;margin:0;font-size:12px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* -- Filters (quiet row) -- */
.filters{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;padding:12px 0 14px;border-bottom:1px solid var(--rule2);margin-bottom:22px}
.filters label.h{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
.filters select{background:var(--white);border:1px solid var(--rule);border-radius:2px;padding:5px 8px;color:var(--ink);font-size:13px}
.tg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--white)}
.tg button{padding:5px 11px;border:0;border-left:1px solid var(--rule);font-size:12.5px;background:var(--white);color:var(--ink2);cursor:pointer}
.tg button:first-child{border-left:0}
.tg button.on{background:var(--accent);color:#fff}
.btn{padding:5px 11px;border:1px solid var(--rule);border-radius:2px;font-size:12.5px;background:var(--white);color:var(--ink2);cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dd{position:relative}
.ddp{position:absolute;z-index:20;top:100%;left:0;margin-top:6px;background:var(--white);border:1px solid var(--rule);border-radius:2px;padding:10px;max-height:340px;overflow:auto;width:300px;box-shadow:0 8px 22px rgba(28,27,25,.10)}
.ddp label{display:flex;gap:8px;align-items:center;padding:5px 2px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--rule2)}
.ddp label:last-child{border-bottom:0}
.ddp .tag{font-size:11px;color:var(--dim);margin-left:auto}

/* -- Stat line (KPIs) -- */
.kpis{display:flex;flex-wrap:wrap;margin:0 0 30px}
.kpi{flex:1 1 0;min-width:130px;padding:0 18px;border-left:1px solid var(--rule)}
.kpi:first-child{border-left:none;padding-left:0}
.kpi .v{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.kpi .l{font-size:12.5px;color:var(--ink2);margin-top:7px;font-weight:500}
.kpi .m{font-size:11.5px;color:var(--muted);margin-top:2px}

/* -- Sections -- */
.card{margin:0 0 34px;min-width:0}
h3{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
h3 .m{font-size:11.5px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 8px 7px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
th.n{text-align:right} th.c{text-align:center}
th:first-child,td:first-child{padding-left:0}
td{padding:8px 8px;border-bottom:1px solid var(--rule2);white-space:nowrap}
td b{font-weight:600}
tr.tot td{border-top:1.5px solid var(--ink);border-bottom:none;font-weight:700;color:var(--ink)}
tr.tot td b{font-weight:700}
tr.dim td{color:var(--dim);font-style:italic}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:0 40px}
.big{font-family:var(--serif);font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:1.05;margin-top:3px}
.bigs{display:flex;gap:30px;flex-wrap:wrap;margin:10px 0 14px}
.bigs .m{font-size:12px}
.note{margin-top:10px;font-size:13.5px;color:var(--ink2)}
.foot-note{margin-top:8px;font-size:12px;color:var(--muted)}

/* bars / tiles / key */
.brow{display:grid;grid-template-columns:170px 1fr 64px 64px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule2)}
.btrack{height:6px;background:var(--rule2);overflow:hidden}
.bfill{height:100%;background:var(--accent)}
.bv{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rots{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin-top:10px}
.rot{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 10px;text-align:center;background:var(--white)}
.rl{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.rv{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin:2px 0}
.rot .m{font-size:11px}
.setkey{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 26px;margin-top:8px}
.setkey div{font-size:13px;line-height:1.45;padding:3px 0;border-bottom:1px solid var(--rule2)}
.mix{display:flex;height:6px;width:160px;overflow:hidden;background:var(--rule2)}
.empty{color:var(--muted);padding:16px 0;font-family:var(--serif);font-style:italic;font-size:15px}
.help{background:var(--tint);border-left:3px solid var(--accent);padding:10px 14px;font-size:13px;line-height:1.55;color:var(--ink2);margin:8px 0 12px;display:none}
.help b{color:var(--ink)}
.qb{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);background:var(--white);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;line-height:16px;padding:0;letter-spacing:0}
.qb:hover{border-color:var(--accent);color:var(--accent)}
.phase{display:flex;flex-wrap:wrap;margin:0 0 18px}
.foot{color:var(--dim);font-size:12px;text-align:left;margin:30px 0 0;padding-top:12px;border-top:1px solid var(--rule)}

/* -- Phones -- */
@media(max-width:760px){
  .wrap{padding:18px 16px 30px}
  .mast{flex-direction:column;align-items:flex-start;gap:8px}
  .mast h1{font-size:30px}
  .mast-r{text-align:left}
  .kpis{display:grid;grid-template-columns:1fr 1fr;row-gap:18px}
  .kpi{padding:0 14px}
  .kpi:nth-child(odd){border-left:none;padding-left:0}
  .kpi .v{font-size:30px}
  .g2{grid-template-columns:1fr}
  .brow{grid-template-columns:110px 1fr 54px 54px;gap:8px}
  .filters{gap:14px}
  .tabs{gap:18px}
  .big{font-size:27px}
}
@media print{.filters,.tabs,.mast .txtbtn,.qb,.foot{display:none!important}body{background:#fff}}
</style></head>
<body>

<div id="login"><div class="lbox">
  <div class="kicker">Player Reports</div>
  <div class="logo">Loyola Volleyball</div>
  <div class="sub">Loyola Men's Volleyball, your personal stats</div>
  <label for="lp">Player</label><select id="lp"><option value="">Loading...</option></select>
  <label for="lpw">Password</label><input id="lpw" type="password" autocomplete="current-password" placeholder="xxxx-xxxx-xxxx">
  <button id="lbtn" onclick="signIn()">Sign in</button>
  <div id="lerr"></div>
  <div class="help-line">Forgot your password? Ask Coach.</div>
</div></div>

<div id="app"><div class="wrap">
  <header class="mast">
    <div><div class="kicker" id="h-kicker">Loyola Men's Volleyball</div><h1><span class="num" id="h-num"></span><span id="h-name"></span></h1></div>
    <div class="mast-r"><div id="h-sub"></div><div id="h-upd"></div><button class="txtbtn" onclick="signOut()">Sign out</button></div>
  </header>
  <div class="viewsw" id="viewsw"><button class="on" onclick="setView('me')">My stats</button><button onclick="setView('scout')">Opponent scouting</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters">
    <div><label class="h">Season</label><select id="f-season" onchange="setF('season',this.value)"></select></div>
    <div><label class="h">Session type</label><span class="tg" id="f-type"></span></div>
    <div class="dd"><label class="h">Sessions</label><button class="btn" id="f-sess-btn" onclick="toggleSess(event)"></button><div class="ddp" id="f-sess" style="display:none" onclick="event.stopPropagation()"></div></div>
    <div id="f-set-wrap"><label class="h">Set</label><select id="f-set" onchange="setF('set',this.value)"></select></div>
    <div><label class="h">Pass scale</label><span class="tg" id="f-scale"></span></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="panel"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="scout-wrap"><div id="scout-status"></div><iframe id="scout-frame" title="Opponent scouting"></iframe></div>
</div>

<script>
'use strict';
// -- Decrypt (matches build_player_portal.py) ---------------------------------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(file, pw) {
  const salt = b64(file.salt), nonce = b64(file.nonce), ct = b64(file.ct), tag = b64(file.tag);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: file.iter, hash: 'SHA-256' }, base, 512));
  const hm = { name: 'HMAC', hash: 'SHA-256' };
  const ek = await crypto.subtle.importKey('raw', bits.slice(0, 32), hm, false, ['sign']);
  const mk = await crypto.subtle.importKey('raw', bits.slice(32), hm, false, ['verify']);
  const msg = new Uint8Array(nonce.length + ct.length); msg.set(nonce); msg.set(ct, nonce.length);
  if (!(await crypto.subtle.verify('HMAC', mk, tag, msg))) throw new Error('badpw');
  const nb = Math.ceil(ct.length / 32), jobs = [];
  for (let i = 0; i < nb; i++) { const m = new Uint8Array(nonce.length + 4); m.set(nonce); new DataView(m.buffer).setUint32(nonce.length, i); jobs.push(crypto.subtle.sign('HMAC', ek, m)); }
  const ks = await Promise.all(jobs);
  const out = new Uint8Array(ct.length);
  for (let i = 0; i < nb; i++) { const k = new Uint8Array(ks[i]); const o = i * 32; for (let j = 0; j < 32 && o + j < ct.length; j++) out[o + j] = ct[o + j] ^ k[j]; }
  const txt = await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
  return JSON.parse(txt);
}

let ROSTER = null, PD = null;
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };

async function loadRoster() {
  const sel = document.getElementById('lp');
  try {
    ROSTER = await (await fetch('player_data/roster.json', { cache: 'no-cache' })).json();
    sel.innerHTML = '<option value="">Select your name</option>' + ROSTER.players.map(p => `<option value="${p.id}">#${p.num} ${esc(p.name)}</option>`).join('');
    const saved = ss.get('luc_pp');
    if (saved) { const [id, pw] = JSON.parse(saved); sel.value = id; document.getElementById('lpw').value = pw; signIn(true); }
  } catch (e) { sel.innerHTML = '<option value="">Could not load roster</option>'; }
}
async function signIn(auto) {
  const id = document.getElementById('lp').value, pw = document.getElementById('lpw').value.trim();
  const err = document.getElementById('lerr'), btn = document.getElementById('lbtn');
  if (!id) { err.textContent = 'Select your name.'; return; }
  if (!pw) { err.textContent = 'Enter your password.'; return; }
  if (!window.crypto?.subtle || !window.DecompressionStream) { err.textContent = 'This browser is too old. Update Safari/Chrome and try again.'; return; }
  btn.disabled = true; btn.textContent = 'Unlocking...'; err.textContent = '';
  try {
    const f = await (await fetch(`player_data/${id}.json`, { cache: 'no-cache' })).json();
    PD = await unlock(f, pw);
    ss.set('luc_pp', JSON.stringify([id, pw]));
    document.getElementById('lpw').value = '';
    startApp();
  } catch (e) {
    err.textContent = e.message === 'badpw' ? 'Incorrect password.' : 'Something went wrong. Try again.';
    if (auto) ss.del('luc_pp');
  } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}
function signOut() { PD = null; ss.del('luc_pp'); location.reload(); }

// -- Opponent scouting (same scouting section as the coach dashboard) ----------
// player_data/scouting.json holds only opponent scouting data, locked with a key that sits inside every
// player's own locked file (PD.scout_key). scout_app.html is the dashboard page without data; it runs in
// the iframe in scouting-only mode (window.SCOUT_APP).
let SCOUT_STATE = 0;   // 0 not loaded, 1 loading, 2 loaded
function setView(v) {
  const me = v === 'me';
  document.querySelectorAll('#viewsw button').forEach((b, i) => b.classList.toggle('on', (i === 0) === me));
  ['tabs', 'filters', 'kpis', 'panel', 'foot'].forEach(id => { document.getElementById(id).style.display = me ? '' : 'none'; });
  document.getElementById('scout-wrap').style.display = me ? 'none' : 'block';
  if (!me) openScouting();
}
async function openScouting() {
  if (SCOUT_STATE) return;
  const st = document.getElementById('scout-status');
  if (!PD || !PD.scout_key) { st.textContent = 'Scouting is not available yet. Ask Coach.'; return; }
  SCOUT_STATE = 1; st.textContent = 'Unlocking opponent scouting...';
  try {
    const [f, tpl] = await Promise.all([
      fetch('player_data/scouting.json', { cache: 'no-cache' }).then(r => r.json()),
      fetch('scout_app.html', { cache: 'no-cache' }).then(r => r.text())]);
    const data = await unlock(f, PD.scout_key);
    const json = JSON.stringify(data).replace(/</g, '\\u003c');
    document.getElementById('scout-frame').srcdoc = tpl
      .replace('<head>', () => '<head><script>window.SCOUT_APP=true;document.documentElement.classList.add("scout-app");<\/script>')
      .replace('__DASHBOARD_DATA__', () => json);
    SCOUT_STATE = 2; st.textContent = '';
  } catch (e) { SCOUT_STATE = 0; st.textContent = 'Could not load scouting. Check your connection and try again.'; }
}
document.getElementById('lpw').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });

// -- State --------------------------------------------------------------------
const F = { season: null, type: 'match', sel: null, set: 'all', scale: '4', tab: 'servrcv', sdPhase: 'all' };
const POS = { '1': 'Libero', '2': 'Outside Hitter', '3': 'Opposite', '4': 'Middle', '5': 'Setter' };
const POSG = { '1': 'LIBEROS', '2': 'OUTSIDES', '3': 'OPPOSITES', '4': 'MIDDLES', '5': 'SETTERS' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function startApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const p = PD.player;
  F.season = PD.seasons[PD.seasons.length - 1];
  const num = p.nums[F.season];
  document.getElementById('h-num').textContent = '#' + num;
  document.getElementById('h-name').textContent = p.name;
  if (!PD.sessions.some(s => s.se === F.season && s.t === 'match')) F.type = 'both';
  document.getElementById('foot').textContent = 'Data updated ' + PD.gen + ', only your own stats are in this page';
  document.getElementById('h-upd').textContent = 'Updated ' + PD.gen;
  document.addEventListener('click', () => { document.getElementById('f-sess').style.display = 'none'; });
  render();
}
function setF(k, v) { F[k] = v; if (k === 'season' || k === 'type') { F.sel = null; F.set = 'all'; } render(); }

// -- Data selection + aggregation ---------------------------------------------
function inScope() { return PD.sessions.filter(s => (F.season === 'all' || s.se === F.season) && (F.type === 'both' || s.t === F.type)); }
function selected() { return inScope().filter(s => !F.sel || F.sel.has(s.id)); }
function addInto(dst, src) {
  for (const [k, v] of Object.entries(src || {})) {
    if (v === null || v === undefined) continue;
    if (Array.isArray(v)) { const c = dst[k] || (dst[k] = v.map(() => 0)); v.forEach((x, i) => c[i] += x || 0); }
    else if (typeof v === 'object') addInto(dst[k] || (dst[k] = {}), v);
    else if (typeof v === 'number') dst[k] = (dst[k] || 0) + v;
  }
  return dst;
}
const hasTouch = pa => pa && Object.keys(pa).some(k => k[0] !== 'X');
function nameOf(se, n) { return (PD.names[se] || {})[n] || ('#' + n); }
function keyed(obj, se) {   // re-key setter/hitter numbers by name so seasons with different numbers merge correctly
  const o = {}; for (const [k, v] of Object.entries(obj || {})) o[(k === 'OTHER' || k === 'MISC' || k === 'OVR') ? k : nameOf(se, k)] = v; return o;
}
function aggregate() {
  const A = { sk: {}, rz: {}, dk: [0, 0], rot: {}, bs: {}, fb: [0, 0], pa: {}, ph: {}, hc: {}, sd: {}, sr: {}, sbt: {}, sbo: {}, sets: 0, n: 0, months: {} };
  for (const s of selected()) {
    const slices = (F.set !== 'all' && s.t === 'match') ? (s.s && s.s[F.set] ? [s.s[F.set]] : []) : [s.a];
    for (const x of slices) {
      A.n++;
      addInto(A.sk, x.sk); addInto(A.rz, x.rz); addInto(A, { dk: x.dk || [0, 0], fb: x.fb || [0, 0] });
      addInto(A.rot, x.rot); addInto(A.bs, keyed(x.bs, s.se));
      addInto(A.pa[s.t] || (A.pa[s.t] = {}), x.pa); addInto(A.ph, x.ph); addInto(A.hc, x.hc);
      if (x.sd) { const sd = {}; for (const [h, ph] of Object.entries(keyed(x.sd, s.se))) sd[h] = ph; addInto(A.sd, sd); }
      if (x.sr) { const o = {}; for (const [r, v] of Object.entries(x.sr)) o[r] = { c: v.c, h: keyed(v.h, s.se) }; addInto(A.sr, o); }
      addInto(A.sbt, x.sbt); addInto(A.sbo, x.sbo);
      const mk = s.d.slice(0, 7); addInto(A.months[mk] || (A.months[mk] = {}), { A: x.sk?.A, R: x.sk?.R, S: x.sk?.S, E: x.sk?.E });
    }
    // sets played (for per-set numbers)
    if (s.t === 'match' && F.set === 'all') A.sets += Object.values(s.s || {}).filter(x => hasTouch(x.pa)).length || (hasTouch(s.a.pa) ? 1 : 0);
    else if (slices.length && hasTouch(slices[0].pa)) A.sets += 1;
  }
  return A;
}

// -- Formatting helpers -------------------------------------------------------
const pct = (x, n) => n ? (x / n * 100).toFixed(1) + '%' : '-';
const effv = (k, e, b, a) => a ? (k - e - b) / a : null;
// Efficiency, volleyball style: .340 / -.050 / 1.000 (formula stays (K - E - BLK) / Att).
// signed=true is for differences (EOE, Eff change): +.034 / -.021.
function fmtEff3(v, signed) {
  if (v === null || v === undefined || !isFinite(v)) return '-';
  const r = Math.round(v * 1000) / 1000, a = Math.abs(r);
  const body = a >= 1 ? a.toFixed(3) : a.toFixed(3).replace(/^0/, '');
  if (signed) return (r > 0 ? '+' : r < 0 ? '\u2212' : '') + body;
  return (r < 0 ? '-' : '') + body;
}
// Numbers are plain ink; only notably high/low efficiency (.100 from the .280 team norm, 10+ attempts) is colored
const EFF_BASE = 0.280, EFF_SIG = 0.100, EFF_MIN_N = 10;
const ec = (v, n) => (v === null || v === undefined || isNaN(v) || (n != null && n < EFF_MIN_N)) ? '' : v >= EFF_BASE + EFF_SIG ? 'hi' : v <= EFF_BASE - EFF_SIG ? 'lo' : '';
const evA = (ev, n) => ({ k: ev?.['#'] || 0, e: ev?.['='] || 0, b: ev?.['/'] || 0, a: n || 0 });
function passPts(ev) { ev = ev || {}; return F.scale === '4' ? 4 * (ev['#'] || 0) + 3 * (ev['+'] || 0) + 2 * (ev['!'] || 0) + (ev['-'] || 0) + 0.5 * (ev['/'] || 0)
  : 3 * (ev['#'] || 0) + 2 * (ev['+'] || 0) + 2 * (ev['!'] || 0) + (ev['-'] || 0) + 0.5 * (ev['/'] || 0); }
const passAvg = (ev, n) => n ? passPts(ev) / n : null;
function catPts(c) { return F.scale === '4' ? 4 * (c.perf || 0) + 3 * (c.good || 0) + 2 * (c.med || 0) + (c.oos || 0) + 0.5 * (c.over || 0)
  : 3 * (c.perf || 0) + 2 * (c.good || 0) + 2 * (c.med || 0) + (c.oos || 0) + 0.5 * (c.over || 0); }
const pac = v => v === null ? '' : v >= (F.scale === '4' ? 3 : 2) ? 'hi' : v < (F.scale === '4' ? 2 : 1.5) ? 'lo' : '';
// Set / play types: short name + plain-language description for players
const SET_INFO = {
  X5: ['Go', 'Fast, low set out to the outside hitter (zone 4), in system.'],
  X6: ['X', 'Fast set to the right side / opposite (zone 2), in system.'],
  X8: ['D', 'Back-row attack from the right side (zone 1).'],
  X0: ['Shoot in 5', 'Fast back-row set to the left side (zone 5).'],
  XP: ['Pipe', 'Back-row attack from the middle of the court (zone 6).'],
  XB: ['Pipe Blue', 'Back-row pipe hit between zones 6 and 1.'],
  XR: ['Pipe Red', 'Back-row pipe hit between zones 6 and 5.'],
  X1: ['Quick', 'First-tempo quick for the middle, right in front of the setter.'],
  X2: ['Back Quick', 'First-tempo quick for the middle, just behind the setter.'],
  XF: ['Low Back Quick', 'Lower, faster quick behind the setter.'],
  XM: ['Quick in 3', 'Quick hit in zone 3 (middle of the net).'],
  XG: ['7-1 Gun', 'Quick set pushed slightly away from the setter.'],
  XC: ['Hook', 'Front quick moved out / hooked toward the antenna.'],
  XD: ['Slide', 'Middle runs behind the setter and hits off one foot.'],
  CF: ['Slide A', 'Slide close to the setter.'], CB: ['Slide B', 'Slide one step away from the setter.'], CD: ['Slide C', 'Slide far from the setter.'],
  X7: ['Gap', 'Quick-tempo set in the gap between the outside and the middle (a "shoot"/31).'],
  X9: ['Rip from 4', 'Outside hitter swings line/rip from zone 4.'], XT: ['Cross from 4', 'Outside hitter crosses in from zone 4.'],
  X3: ['Cross from 2', 'Right side crosses in from zone 2.'], X4: ['Rip from 2', 'Right side rips from zone 2.'],
  V5: ['Hut', 'High set to the outside (zone 4), usually out of system.'],
  V6: ['Red', 'High set to the right side (zone 2), usually out of system.'],
  V8: ['High D', 'High back-row set to the right side (zone 1).'],
  V0: ['High 5', 'High back-row set to the left side (zone 5).'],
  VP: ['High Pipe', 'High back-row set to the middle (zone 6).'], VB: ['High Pipe Blue', 'High pipe between zones 6 and 1.'], VR: ['High Pipe Red', 'High pipe between zones 6 and 5.'],
  V3: ['High 3', 'High set to the middle (zone 3).'],
  PP: ['Setter Dump', 'Setter attacks the second ball instead of setting.'],
  P2: ['Emergency 2nd', 'Second contact attacked in an emergency.'], PR: ['Setover', 'Second ball set/pushed straight over the net.'],
  K1: ['Front Quick call', 'Setter call: middle runs a front quick (X1).'], K2: ['Back Quick call', 'Setter call: middle runs a back quick (X2).'],
  K7: ['Gap call', 'Setter call: middle runs the gap/shoot (X7).'], KD: ['Slide call', 'Setter call: middle runs a slide.'],
};
const cname = c => (SET_INFO[c] || [])[0] || (PD.cn || {})[c] || '';
const cdesc = c => (SET_INFO[c] || [])[1] || (PD.cn || {})[c] || '';
const setCell = c => `<b title="${esc(cdesc(c))}">${c}</b> <span class="m">${esc(cname(c))}</span>`;          // row label
const setHead = c => `<th class="n" title="${esc(cdesc(c))}">${c}<br><span style="font-weight:400;color:var(--dim)">${esc(cname(c))}</span></th>`;  // column header
function setKey(codes) {                       // legend card so phones (no hover) still see what each code means
  const list = [...new Set(codes)].filter(c => c && c !== 'OVR' && cdesc(c));
  if (!list.length) return '';
  return card('Set Type Key', `<div class="setkey">${list.map(c =>
    `<div><b class="acc">${c}</b> <b>${esc(cname(c))}</b> <span class="m" style="font-size:13px">- ${esc(cdesc(c))}</span></div>`).join('')}</div>`);
}
function atkRow(label, r, cls = '') {
  const e = effv(r.k, r.e, r.b ?? r.bk ?? 0, r.a);
  return `<tr class="${cls}"><td>${label}</td><td class="n">${r.k}</td><td class="n">${r.e}</td><td class="n">${r.b ?? r.bk ?? 0}</td><td class="n">${r.a}</td><td class="n ${ec(e, r.a)}"><b>${fmtEff3(e)}</b></td><td class="n">${pct(r.k, r.a)}</td></tr>`;
}
const ATK_H = '<th class="n">K</th><th class="n">E</th><th class="n">BLK</th><th class="n">ATT</th><th class="n">EFF</th><th class="n">K%</th>';
const card = (title, body, extra = '') => `<div class="card"><h3>${title}${extra}</h3>${body}</div>`;
const helpBtn = id => ` <button class="qb" onclick="const e=document.getElementById('${id}');e.style.display=e.style.display==='block'?'none':'block'">?</button>`;
const tbl = (head, rows) => `<div class="tw"><table><tr>${head}</tr>${rows}</table></div>`;
function bucketLbl(b) {
  const L = F.scale === '3' ? { perf: '3-pt pass (#)', good: '2-pt pass (+ / !)', oos: '1-pt pass (-)' } : { perf: '4-pt pass (#)', good: '3-pt pass (+)', med: '2-pt pass (!)', oos: '1-pt pass (-)' };
  return L[b] || ({ fboth: 'Other first ball', transition: 'Transition', fbso: 'First ball' }[b]) || b;
}

// -- Filters UI ---------------------------------------------------------------
function renderFilters() {

  const sSel = document.getElementById('f-season');
  sSel.innerHTML = PD.seasons.slice().reverse().map(s => `<option value="${s}">${s}</option>`).join('') + (PD.seasons.length > 1 ? '<option value="all">All seasons</option>' : '');
  sSel.value = F.season;
  const num = F.season === 'all' ? p.nums[PD.seasons[PD.seasons.length - 1]] : p.nums[F.season];
  document.getElementById('h-num').textContent = '#' + num;
  document.getElementById('h-sub').textContent = (POS[p.pos] || '') + ', ' + (F.season === 'all' ? 'All seasons' : F.season);
  document.getElementById('h-kicker').textContent = "Loyola Men's Volleyball, " + (F.season === 'all' ? 'All seasons' : F.season);
  document.getElementById('f-type').innerHTML = [['match', 'Matches'], ['practice', 'Practices'], ['both', 'Both']]
    .map(([v, l]) => `<button class="${F.type === v ? 'on' : ''}" onclick="setF('type','${v}')">${l}</button>`).join('');
  document.getElementById('f-scale').innerHTML = [['4', '4-pt'], ['3', '3-pt']]
    .map(([v, l]) => `<button class="${F.scale === v ? 'on' : ''}" onclick="setF('scale','${v}')">${l}</button>`).join('');
  const sc = inScope(), n = F.sel ? sc.filter(s => F.sel.has(s.id)).length : sc.length;
  const noun = F.type === 'match' ? 'matches' : F.type === 'practice' ? 'practices' : 'sessions';
  document.getElementById('f-sess-btn').innerHTML = (F.sel ? `${n} of ${sc.length} ${noun}` : `All ${sc.length} ${noun}`) + ' <span style="opacity:.6"></span>';
  const fmtD = d => new Date(d + 'T12:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  document.getElementById('f-sess').innerHTML = `<div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn" onclick="sessAll(true)">All</button><button class="btn" onclick="sessAll(false)">None</button></div>` +
    sc.slice().reverse().map(s => `<label><input type="checkbox" ${!F.sel || F.sel.has(s.id) ? 'checked' : ''} onchange="sessToggle('${esc(s.id).replace(/'/g, "\\'")}',this.checked)"> ${fmtD(s.d)}, ${s.t === 'match' ? 'vs ' : ''}${esc(s.o)}<span class="tag">${s.t === 'match' ? 'Match' : 'Practice'}</span></label>`).join('');
  // Set filter (matches only)

  const showSet = sets.size > 0;
  document.getElementById('f-set-wrap').style.display = showSet ? '' : 'none';
  if (F.set !== 'all' && !sets.has(+F.set)) F.set = 'all';
  document.getElementById('f-set').innerHTML = '<option value="all">All sets</option>' + [...sets].sort((a, b) => a - b).map(n => `<option value="${n}">Set ${n}</option>`).join('');
  document.getElementById('f-set').value = F.set;
}
function toggleSess(e) { e.stopPropagation(); const p = document.getElementById('f-sess'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
function sessToggle(id, on) { const all = inScope().map(s => s.id); if (!F.sel) F.sel = new Set(all); on ? F.sel.add(id) : F.sel.delete(id); if (F.sel.size === all.length) F.sel = null; renderKeepOpen(); }
function sessAll(on) { F.sel = on ? null : new Set(); renderKeepOpen(); }
function renderKeepOpen() { render(); document.getElementById('f-sess').style.display = 'block'; }

// -- What this player actually does --------------------------------------------
// A section only shows when he does that skill for real this season (matches + practices, every session),
// so a setter doesn't get an "attack" report built on 8 swings or a middle a passing report on 5 passes.
// Season totals (not the current filters) keep tabs from appearing / disappearing as filters change.
const ROLE_MIN = { B: 15, D: 15, F: 15 };   // blocks / digs / free balls are rarer touches; everything else needs 30
let RT = {};
function roleTotals() {
  const t = {};
  for (const s of PD.sessions) {
    if (F.season !== 'all' && s.se !== F.season) continue;
    for (const [k, v] of Object.entries((s.a && s.a.sk) || {})) t[k] = (t[k] || 0) + (v.n || 0);
  }
  return t;
}
const does = k => (RT[k] || 0) >= (ROLE_MIN[k] || 30);

// -- Main render --------------------------------------------------------------
let AG = null;
function render() {
  renderFilters();
  RT = roleTotals();
  AG = aggregate();
  const sk = AG.sk, A = sk.A || {}, S = sk.S || {}, R = sk.R || {}, B = sk.B || {}, D = sk.D || {}, E = sk.E || {};
  const a = evA(A.ev, A.n), aE = effv(a.k, a.e, a.b, a.a);
  const k = [];
  if (A.n && does('A')) k.push(['Attack efficiency', `<span class="${ec(aE, A.n)}">${fmtEff3(aE)}</span>`, `${A.n} att, kill ${pct(a.k, a.a)}`]);
  if (PD.player.setter && E.n) k.push(['Sets', E.n, `${(E.ev || {})['='] || 0} set errors`]);
  if (S.n && does('S')) k.push(['Ace rate', pct(S.ev['#'] || 0, S.n), `${S.ev['#'] || 0} aces, ${S.n} serves`]);
  if (S.n && does('S')) k.push(['Serve error rate', pct(S.ev['='] || 0, S.n), `${S.ev['='] || 0} errors`]);
  if (R.n && does('R')) { const pv = passAvg(R.ev, R.n); k.push(['Pass average', `<span class="${pac(pv)}">${pv.toFixed(2)}</span>`, `${R.n} passes, ${F.scale}-pt scale`]); }
  if (B.n && does('B')) k.push(['Block kills', (B.ev || {})['#'] || 0, `${B.n} block touches`]);
  if (D.n && does('D')) k.push(['Digs', D.n - ((D.ev || {})['='] || 0), `${D.n} dig attempts`]);
  document.getElementById('kpis').innerHTML = AG.n ? k.map(([l, v, s]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div><div class="m">${s}</div></div>`).join('') : '';
  const TABS = [['servrcv', 'Serve & Receive'], ['attack', 'Attack by Set Type'], ['setter', 'Attack by Setter'], ['rot', 'Attack by Rotation'], ['blk', 'Block & Defense'], ['adv', 'Advanced']]
    .filter(([v]) => v === 'servrcv' ? (does('S') || does('R')) : (v === 'attack' || v === 'setter') ? does('A')
      : v === 'rot' ? (PD.player.setter || does('A')) : v === 'blk' ? (does('B') || does('D') || does('F')) : true);
  if (PD.player.setter) TABS.splice(TABS.findIndex(t => t[0] === 'rot'), 0, ['dist', 'Setter Breakdown']);
  if (!TABS.some(t => t[0] === F.tab)) F.tab = TABS[0][0];
  document.getElementById('tabs').innerHTML = TABS.map(([v, l]) => `<button data-tab="${v}" class="${F.tab === v ? 'on' : ''}" onclick="F.tab='${v}';render()">${l}</button>`).join('') +
    `<span class="acts">Save PDF <button onclick="exportPortalPDF(false)" title="Save this report as a one-page PDF">This tab</button><button onclick="exportPortalPDF(true)" title="Every report, packed onto as few pages as possible">All reports</button></span>`;
  const P = document.getElementById('panel');
  if (!AG.n) { P.innerHTML = '<div class="card empty">No data for these filters.</div>'; return; }
  P.innerHTML = ({ servrcv: tabServe, attack: tabAttack, setter: tabSetter, dist: tabDist, rot: tabRot, blk: tabBlock, adv: tabAdv })[F.tab]();
}

// -- Serve & Receive ----------------------------------------------------------
function tabServe() {
  const sk = AG.sk; let html = '';
  const srow = (lbl, r) => { if (!r || !r.n) return ''; const ev = r.ev || {}; const avg = (3 * (ev['#'] || 0) + 2 * (ev['+'] || 0) + 2 * (ev['/'] || 0) + (ev['-'] || 0)) / r.n;
    return `<tr><td>${lbl}</td><td class="n">${r.n}</td><td class="n g">${ev['#'] || 0}</td><td class="n">${ev['+'] || 0}</td><td class="n">${ev['/'] || 0}</td><td class="n">${ev['-'] || 0}</td><td class="n r">${ev['='] || 0}</td><td class="n"><b>${pct(ev['#'] || 0, r.n)}</b></td><td class="n r">${pct(ev['='] || 0, r.n)}</td><td class="n">${avg.toFixed(2)}</td></tr>`; };
  if (sk.S && sk.S.n && does('S')) html += card('Serving', tbl('<th></th><th class="n">Att</th><th class="n">Ace</th><th class="n">Pos (+)</th><th class="n">Over (/)</th><th class="n">Neg (-)</th><th class="n">Err</th><th class="n">Ace%</th><th class="n">Err%</th><th class="n">Srv Avg</th>',
    srow('All serves', sk.S) + srow('Float', sk.SM) + srow('Topspin / jump', sk.SQ)) + '<div class="foot-note">Serve avg: ace 3, positive/overpass 2, negative 1, error 0.</div>');
  const four = F.scale === '4';
  const cats = four ? ['perf', 'good', 'med', 'oos', 'over', 'err'] : ['perf', 'good', 'oos', 'over', 'err'];
  const pv = four ? { perf: 4, good: 3, med: 2, oos: 1, over: '0.5', err: 0 } : { perf: 3, good: 2, oos: 1, over: '0.5', err: 0 };
  const CN = { perf: 'Perf', good: 'Good', med: 'Med', oos: 'OoS', over: 'Over', err: 'Err' };
  const catOf = r => { const c = r.cat ? { ...r.cat } : { perf: r.ev['#'] || 0, good: r.ev['+'] || 0, med: r.ev['!'] || 0, oos: r.ev['-'] || 0, over: r.ev['/'] || 0, err: r.ev['='] || 0 }; if (!four) { c.good = (c.good || 0) + (c.med || 0); c.med = 0; } return c; };
  const rrow = (lbl, r) => { if (!r || !r.n) return ''; const c = catOf(r); const av = passAvg(r.ev, r.n);
    return `<tr><td>${lbl}</td><td class="n">${r.n}</td>${cats.map(k => `<td class="n">${c[k] || 0}</td>`).join('')}<td class="n ${pac(av)}"><b>${av.toFixed(2)}</b></td><td class="n">${pct((c.perf || 0) + (c.good || 0), r.n)}</td><td class="n r">${pct(c.err || 0, r.n)}</td></tr>`; };
  if (sk.R && sk.R.n && does('R')) {
    html += card('Reception', tbl(`<th></th><th class="n">Att</th>${cats.map(k => `<th class="n">${CN[k]}, ${pv[k]}</th>`).join('')}<th class="n">Pass Avg</th><th class="n">Perf+Good%</th><th class="n">Err%</th>`,
      rrow('All passes', sk.R) + rrow('vs Float', sk.RM) + rrow('vs Topspin', sk.RQ)) +
      (AG.fb[0] ? `<div class="note">First-ball sideout when you passed: <b class="gold">${pct(AG.fb[1], AG.fb[0])}</b> <span class="m">(${AG.fb[1]} kills on ${AG.fb[0]} passes)</span></div>` : ''));
    const zs = Object.entries(AG.rz).filter(([, v]) => v.n);
    if (zs.length) html += card('Passing by Zone', tbl('<th>Zone</th><th class="n">Att</th><th class="n">Pass Avg</th><th class="n">Perf%</th><th class="n">Err%</th>',
      zs.sort((a, b) => a[0] - b[0]).map(([z, v]) => { const av = passAvg(v.ev, v.n); return `<tr><td>Zone ${z}</td><td class="n">${v.n}</td><td class="n ${pac(av)}"><b>${av.toFixed(2)}</b></td><td class="n">${pct(v.ev['#'] || 0, v.n)}</td><td class="n r">${pct(v.ev['='] || 0, v.n)}</td></tr>`; }).join('')));
  } else if (does('R')) html += card('Reception', '<div class="empty">No receptions in these sessions.</div>');
  const rs = AG.rot.s || {}, rr = AG.rot.r || {};
  const rk = ['1', '2', '3', '4', '5', '6'].filter(r => (rs[r] && rs[r].att) || (rr[r] && rr[r].att));
  if (rk.length) html += card('By Rotation <span class="m" style="text-transform:none;letter-spacing:0">matches only (rotations are not coded in practices)</span>', tbl('<th>Rotation</th><th class="n">Serves</th><th class="n">Ace</th><th class="n">Err</th><th class="n">Passes</th><th class="n">Pass Avg</th>',
    rk.map(r => { const s = rs[r] || {}, p = rr[r] || {}; const av = p.att ? catPts(four ? p : { ...p, good: (p.good || 0) + (p.med || 0), med: 0 }) / p.att : null;
      return `<tr><td>Rotation ${r}</td><td class="n">${s.att || '-'}</td><td class="n g">${s.att ? s.ace : ''}</td><td class="n r">${s.att ? s.err : ''}</td><td class="n">${p.att || '-'}</td><td class="n ${pac(av)}">${av === null ? '-' : av.toFixed(2)}</td></tr>`; }).join('')) + '<div class="foot-note">Matches only.</div>');
  return html || card('Serve & Receive', '<div class="empty">No serves or passes in these sessions.</div>');
}

// -- Attack by set type (+ by pass before the attack) -------------------------
function tabAttack() {
  const A = AG.sk.A;
  if (!A || !A.n) return card('Attack by Set Type', '<div class="empty">No attacks in these sessions.</div>');
  const rows = Object.entries(A.c || {}).sort((a, b) => b[1].n - a[1].n).map(([c, v]) => atkRow(setCell(c), evA(v.ev, v.n))).join('');
  let html = card('Attack by Set Type', tbl('<th>Set type</th>' + ATK_H, rows + atkRow('TOTAL', evA(A.ev, A.n), 'tot'))) + setKey(Object.entries(A.c || {}).sort((a, b) => b[1].n - a[1].n).map(x => x[0]));
  // by pass quality before the attack (from the Points Added touch log)
  const cells = hitterCells();
  if (Object.keys(cells.ph).length) {
    const PH = ['#', '+', '!', '-', 'o', 'T'].filter(p => cells.ph[p]);
    const lbl = { '#': bucketLbl('perf'), '+': bucketLbl('good'), '!': bucketLbl('med'), '-': bucketLbl('oos'), o: 'Other first ball', T: 'Transition' };
    html += card('Attack by Pass Before It', tbl('<th>Situation</th>' + ATK_H, PH.map(p => atkRow(lbl[p], cells.ph[p])).join('')));
  }
  return html;
}
function hitterCells() {    // his attacks by situation from the touch log: sit "phase/group" -> {k,e,b,a}

// -- Advanced -----------------------------------------------------------------
const PA_SKILL = { S: 'Serve', R: 'Pass', A: 'Attack', E: 'Set', X: 'Set', B: 'Block', D: 'Dig' };
const PA_COLS = ['Serve', 'Pass', 'Attack', 'Set', 'Block', 'Dig'], PA_M = 20, PA_SHARE = 0.25;
function paNorm(key) {
  if (F.scale !== '3') return key;
  const [sk, ev, sit] = key.split('|');
  return `${sk}|${(sk === 'R' && ev === '!') ? '+' : ev}|${(sk === 'A' || sk === 'X') && sit && sit[0] === '!' ? '+' + sit.slice(1) : sit}`;
}
function paTables(pool) {
  const P = {}; const XA = [0, 0];
  for (const [k0, v] of Object.entries(pool)) { if (k0[0] === 'X') { XA[0] += v[0]; XA[1] += v[1]; continue; } const k = paNorm(k0); const r = P[k] || (P[k] = [0, 0]); r[0] += v[0]; r[1] += v[1]; }
  const acc = {}; const put = (k, v) => { const r = acc[k] || (acc[k] = [0, 0]); r[0] += v[0]; r[1] += v[1]; };
  for (const [k, v] of Object.entries(P)) { const [sk, ev, sit] = k.split('|'); put('sk:' + sk, v); put('ev:' + sk + '|' + ev, v); put('sit:' + sk + '|' + sit, v); put('evsit:' + k, v); if (sk === 'A') put('ph:' + sit.split('/')[0], v); }
  const wp = k => acc[k] && acc[k][0] ? acc[k][1] / acc[k][0] : null;
  const shr = (k, prior) => { const r = acc[k]; return r ? (r[1] + PA_M * prior) / (r[0] + PA_M) : prior; };
  return {
    basic(sk, ev) { const b = wp('sk:' + sk), e = wp('ev:' + sk + '|' + ev); return (b === null || e === null) ? 0 : e - b; },
    setVal(ev) { const e = wp('ev:A|' + ev); return (e === null || !XA[0]) ? 0 : e - XA[1] / XA[0]; },
    sitBase(sk, sit) { return shr('sit:' + sk + '|' + sit, wp('sk:' + sk) ?? 0); },
    sitEv(sk, ev, sit) { return shr('evsit:' + sk + '|' + ev + '|' + sit, wp('ev:' + sk + '|' + ev) ?? 0); },
    atkSit(sit) { const ph = sit.split('/')[0]; return shr('sit:A|' + sit, wp('ph:' + ph) ?? wp('sk:A') ?? 0); },
    atkPhase(ph) { return shr('ph:' + ph, wp('sk:A') ?? 0); },

}
function paValue(T, key, n, out) {          // each touch vs the average touch of that skill
  const [sk, ev] = paNorm(key).split('|');
  if (sk === 'X') { out.Set += n * T.setVal(ev); return; }   // attack result off his set vs the average attack off a set
  if (PA_SKILL[sk]) out[PA_SKILL[sk]] += n * T.basic(sk, ev);

const PA_WCOLS = ['Competition', 'Attack', 'Pass', 'Block', 'Serve', 'Dig', 'Set'];
const PA_WLBL = { Competition: 'Competition', Attack: 'Attacking', Pass: 'Serve Receive', Block: 'Blocking', Serve: 'Serving', Dig: 'Defense', Set: 'Setting' };
function cardPA() {

  const posName = { OUTSIDES: 'outside', OPPOSITES: 'opposite', MIDDLES: 'middle', SETTERS: 'setter', LIBEROS: 'libero' }[PD.pa_grp] || 'position';
  const help = `<div class="help" id="h-pa"><b>Points Added</b> measures how much your touches raised or lowered our chance of winning the rally compared with an average touch of the same skill (+1.0 about  one extra point for the team). <b>Setting</b> = the attack result off each of your sets vs the average attack off a set. <b>Competition</b> = practice drill results, (wins - losses) / 2. Your <b>score</b> weights each category by how much it matters for a ${posName} (the % column). Small samples swing a lot.</div>`;

}

function cardEOE() {
  if (!does('A')) return '';
  const me = hitterCells(); const n = Object.values(me.cells).reduce((s, r) => s + r.a, 0);
  const help = `<div class="help" id="h-eoe"><b>Expected</b> is what an average Loyola hitter would hit on exactly your mix of balls (the pass before the attack + the set type), using the whole team's results on each kind of ball. <b>EOE</b> = your actual efficiency - expected. Positive means you did better than the balls you got would predict. Efficiency is (K - E - BLK) / Att.</div>`;
  if (!n) return '';
  const norm = ph => (F.scale === '3' && ph === '!') ? '+' : ph; const z = () => ({ k: 0, e: 0, b: 0, a: 0 });

    for (const t of [team[sit] || (team[sit] = z()), phaseT[norm(p0)] || (phaseT[norm(p0)] = z()), tot]) { t.k += r.k; t.e += r.e; t.b += r.b; t.a += r.a; } }

  const all = Object.values(me.cells).reduce((a, r) => ({ k: a.k + r.k, e: a.e + r.e, b: a.b + r.b, a: a.a + r.a }), z());
  const raw = eff(all), exp = Object.entries(me.cells).reduce((s, [sit, c]) => s + c.a * teamEff(sit), 0) / n, eoe = raw - exp;
